name: Compilar app para iPhone

on:
  push:
    branches: [main]
    paths-ignore: ['tools/**', '.github/workflows/cloudtest.yml', '.github/workflows/models.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Elegir la versión más reciente de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generar el proyecto de Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild \
            -project Nitida.xcodeproj \
            -scheme Nitida \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -40 || true
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Build/Products/Release-iphoneos/Nitida.app/Nitida
          test -f build/Build/Products/Release-iphoneos/Nitida.app/Info.plist

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nitida.app Payload/
          zip -qr Nitida.ipa Payload
          ls -lh Nitida.ipa
          test $(stat -f%z Nitida.ipa) -gt 1000000

      - name: Subir registro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nítida (compilación ${{ github.run_number }})
          make_latest: true
          files: Nitida.ipa
          body: |
            Descarga **Nitida.ipa** e instálala con SideStore (o Sideloadly/AltStore).
