name: Prueba modelos en la nube (gratis)
on:
  workflow_dispatch:
    inputs:
      spaces:
        description: Spaces de Hugging Face a probar
        default: finegrain/finegrain-image-enhancer
      script:
        default: run.py
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client
      - run: mkdir -p out && python3 tools/cloudtest/${{ inputs.script }} ${{ inputs.spaces }}
      - name: Publicar resultados en la rama cloudtest-results
        if: always()
        run: |
          git config user.name "cloudtest"; git config user.email "noreply@github.com"
          git checkout --orphan cloudtest-results
          git rm -rfq . ; cp -r out/* . 2>/dev/null || true
          git add -A && git commit -qm "Resultados" && git push -f origin cloudtest-results
