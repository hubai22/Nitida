name: Probar modelos NTIRE 2026 (móvil)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 https://github.com/jiatongli2024/NTIRE2026_Mobile_RealWorld_ImageSR ntire
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers==0.31.0 gdown onnx onnxruntime opencv-python-headless safetensors
      - run: mkdir -p onnx out && python3 tools/ntire/export_and_test.py
      - name: Resultados a la rama ntire-results
        if: always()
        run: |
          git config user.name "ntire"; git config user.email "noreply@github.com"
          mkdir -p /tmp/res && cp -r out/* /tmp/res/ 2>/dev/null || true
          git checkout --orphan ntire-results && git rm -rfq . && cp -r /tmp/res/* . 2>/dev/null || true
          git add -A && git commit -qm "Resultados" && git push -f origin ntire-results
      - name: Publicar modelos ONNX
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-2
          name: Modelos NTIRE 2026
          make_latest: false
          files: onnx/*.onnx
